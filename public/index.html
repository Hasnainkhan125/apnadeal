<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ===== FAVICON & LOGO ===== -->
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ===== DISABLE ZOOM ON MOBILE ===== -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Apna Deal Market - Buy and sell anything fast and secure. AI-powered listings, verified sellers, and escrow payments."
    />

    <!-- ===== OPEN GRAPH / SOCIAL ===== -->
    <meta property="og:title" content="Apna Deal Market" />
    <meta
      property="og:description"
      content="Buy and sell anything fast and secure. AI-powered listings, verified sellers, and escrow payments."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo.png" />
    <meta property="og:type" content="website" />

    <!-- ===== TWITTER ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apna Deal Market" />
    <meta
      name="twitter:description"
      content="Buy and sell anything fast and secure. AI-powered listings, verified sellers, and escrow payments."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.png" />

    <title>APNA DEAL</title>

    <!-- ===== ADDITIONAL: Disable zoom with CSS (Android Chrome) ===== -->
    <style>
      /* Prevent zoom on touch */
      html, body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background: #000;
      }

      html.light, body.light {
        background: #fff;
      }
      
      /* Prevent zoom on inputs */
      input, textarea, select {
        font-size: 16px !important;
        touch-action: manipulation;
      }
      
      /* Prevent double-tap zoom */
      * {
        touch-action: manipulation;
      }
    </style>
    
    <!-- ===== Disable pinch zoom with JavaScript (fallback) ===== -->
    <script>
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
      
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      });
      
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      });
      
      // Disable double-tap zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
