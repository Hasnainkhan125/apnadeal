<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    
    <!-- ===== DISABLE ZOOM ON MOBILE ===== -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="AI Study Assistant - AI-powered study tools to help you learn faster, retain more, and achieve better results."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>AI Study Assistant</title>
    
    <!-- ===== ADDITIONAL: Disable zoom with CSS (Android Chrome) ===== -->
    <style>
      /* Prevent zoom on touch */
      html, body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      
      /* Prevent zoom on inputs */
      input, textarea, select {
        font-size: 16px !important;
        touch-action: manipulation;
      }
      
      /* Prevent double-tap zoom */
      * {
        touch-action: manipulation;
      }
    </style>
    
    <!-- ===== Disable pinch zoom with JavaScript (fallback) ===== -->
    <script>
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
      
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      });
      
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      });
      
      // Disable double-tap zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
